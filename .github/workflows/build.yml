name: Build

on:
    workflow_call:
        inputs:
            artifact_type:
                required: true
                type: string
            xml_path:
                required: false
                type: string
                default: "."
            pr_check:
                required: false
                type: boolean
                default: true

jobs:
    pr_check:
        if: ${{ inputs.pr_check }}
        uses: ./.github/workflows/pr_check.yml
        with:
            artifact_type: ${{ inputs.artifact_type }}
            xml_path: ${{ inputs.xml_path }}
            
    build:
        name: build artifact
        needs: pr_check
        if: ${{ always() && (needs.pr_check.result == 'success' || needs.pr_check.result == 'skipped') }}
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Build
              run: |
                if [ "${{ inputs.artifact_type }}" == "backend" ]; then
                    echo "Building backend artifact"
                elif [ "${{ inputs.artifact_type }}" == "frontend" ]; then
                    echo "Building frontend artifact"
                else
                    echo "Unknown artifact type: ${{ inputs.artifact_type }}"
                    exit 1
                fi
